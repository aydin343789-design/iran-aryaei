name: Build Integrated Android APK

on:
  workflow_dispatch:
    inputs:
      bundle_voices:
        description: "Bundle Persian Piper voices inside the APK"
        type: choice
        options: [none, all]
        default: all
  push:
    branches: [main, fix-iran-aryaei-luxury, integrate-text-to-speech]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Bundle Persian voices
        if: ${{ inputs.bundle_voices != 'none' }}
        run: node scripts/fetch-voices.mjs

      - name: Bundle Piper and eSpeak-NG runtime assets
        run: node scripts/fetch-piper-assets.mjs

      - name: Build static web app
        env:
          STATIC_EXPORT: "1"
        run: |
          mkdir -p /tmp/api-backup
          if [ -d src/app/api ]; then mv src/app/api /tmp/api-backup/api; fi
          npm run build
          if [ -d /tmp/api-backup/api ]; then mv /tmp/api-backup/api src/app/api; fi
          test -f out/index.html
          test -f out/iran-aryaei/index.html

      - name: Add Android platform and native patches
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload integrated APK
        uses: actions/upload-artifact@v4
        with:
          name: iran-aryaei-integrated-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
