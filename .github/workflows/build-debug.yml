name: Build Iran Aryaei Studio v3.5.0

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish-piper-voices:
    name: Publish Persian Piper models to this repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download the three Persian voice models and configs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voice-assets
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/fa/fa_IR"
          curl -L --fail --retry 5 --retry-all-errors "$base/amir/medium/fa_IR-amir-medium.onnx" -o voice-assets/fa_IR-amir-medium.onnx
          curl -L --fail --retry 5 --retry-all-errors "$base/amir/medium/fa_IR-amir-medium.onnx.json" -o voice-assets/fa_IR-amir-medium.onnx.json
          curl -L --fail --retry 5 --retry-all-errors "$base/ganji_adabi/medium/fa_IR-ganji_adabi-medium.onnx" -o voice-assets/fa_IR-ganji_adabi-medium.onnx
          curl -L --fail --retry 5 --retry-all-errors "$base/ganji_adabi/medium/fa_IR-ganji_adabi-medium.onnx.json" -o voice-assets/fa_IR-ganji_adabi-medium.onnx.json
          mana="https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/main"
          curl -L --fail --retry 5 --retry-all-errors "$mana/fa_IR-mana-medium.onnx" -o voice-assets/fa_IR-mana-medium.onnx
          curl -L --fail --retry 5 --retry-all-errors "$mana/fa_IR-mana-medium.onnx.json" -o voice-assets/fa_IR-mana-medium.onnx.json
          for f in voice-assets/*.onnx; do
            test "$(stat -c%s "$f")" -gt 1000000
          done
          ls -lh voice-assets
          sha256sum voice-assets/* > voice-assets/SHA256SUMS.txt

      - name: Publish persistent release downloads in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v3.5.0-piper-voices"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" voice-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" voice-assets/* \
              --title "Iran Aryaei Studio 3.5.0 — Persian Piper voices" \
              --notes "Persian offline Piper voice models (Mana, Amir, Ganji Adabi) and their JSON configs. Published here so the app downloads voices from its own GitHub repository. Model licenses and credits remain with their respective upstream projects." \
              --latest --repo "$GITHUB_REPOSITORY"
          fi

  build-apk:
    name: Build APK from extracted Studio v3.5.0
    needs: publish-piper-voices
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Studio v3.5.0 web assets
        shell: bash
        run: |
          set -euo pipefail
          archive="IranAryaei-Studio-v3.5.0-extracted (1).zip"
          test -f "$archive"
          mkdir -p "$RUNNER_TEMP/studio-extracted" www
          unzip -q "$archive" -d "$RUNNER_TEMP/studio-extracted"
          test -f "$RUNNER_TEMP/studio-extracted/assets/public/index.html"
          rm -rf www/*
          cp -a "$RUNNER_TEMP/studio-extracted/assets/public/." www/

          # Guard: the TTS engine and Piper runtime must remain byte-for-byte unchanged.
          cd www
          cat > "$RUNNER_TEMP/tts-sha256.txt" <<'HASHES'
          6c43be297962408ce96237923c187794add8cbbbbeb88411350ab578a6ddd053  tts.js
          1be44e50c51b36f02212aca50a52c1c507b518d5a3554adc2bf7c5b1aa160768  voice-engine.js
          f533b5f21790563d7556c611c3835ac65848ee326da2689aac54ed7d9cc8c6a4  piper/ort-wasm-simd.wasm
          90533a3fd7006df7f897c0d63c468996da5c8e430e39964d92ebe586c4996614  piper/ort.wasm.min.js
          29f1025eb23a5b5c192cd14a6efbce4509402ff265405072ee6f7d1a09b78f8c  piper/piper_phonemize.data
          b5ac96981729547606fd026b8e3829aad81e9e3c22308869d50473259c563283  piper/piper_phonemize.js
          b777cd107a91d2bcc6a1ea46f2c26a662a7407394fe84589198aeaa83dd7a9d6  piper/piper_phonemize.wasm
          714e916a2ec8fb49a1ab1429dca0de184b22baac9ac859a0ef0b52fe0363bfbb  piper/worker.js
          HASHES
          sha256sum -c "$RUNNER_TEMP/tts-sha256.txt"
          cd "$GITHUB_WORKSPACE"

          test -f www/models/index.json
          test -f www/piper/worker.js
          du -sh www

      - name: Copy v3.5.0 assets into Android project
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -a www/. android/app/src/main/assets/public/

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IranAryaei-Studio-v3.5.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
