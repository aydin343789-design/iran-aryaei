# ساخت خودکار فایل APK «ندای پهلوی» با GitHub Actions
#
# نحوهٔ استفاده: در گیت‌هاب به تب Actions بروید، «Build Android APK» را انتخاب کنید،
# دکمهٔ «Run workflow» را بزنید و گزینهٔ bundle_voices را انتخاب کنید.
# پس از چند دقیقه فایل APK در بخش Artifacts آماده است.
# راهنمای کامل فارسی: ANDROID.md
#
# - اپ هیچ سروری لازم ندارد؛ موتور صوتی داخل خود APK است.
# - bundle_voices = all  → سه صدای فارسی داخل APK گذاشته می‌شود (حدود ۲۰۰ مگابایت)
#                          و اپ از همان لحظهٔ اول کاملاً آفلاین کار می‌کند.
# - bundle_voices = none → APK سبک (حدود ۴۰ مگابایت)؛ هر صدا در اولین استفاده
#                          یک‌بار دانلود می‌شود.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      bundle_voices:
        description: "صداهای فارسی داخل APK گذاشته شوند؟ (all = بله، none = خیر و دانلود در اپ)"
        type: choice
        options:
          - all
          - none
        default: all
  push:
    tags:
      - "v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor 8 به Node 22 و JDK 21 نیاز دارد
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Bundle Persian voice models inside the APK
        if: ${{ inputs.bundle_voices != 'none' }}
        run: node scripts/fetch-voices.mjs

      - name: Bundle Piper and eSpeak-NG runtime assets
        run: node scripts/fetch-piper-assets.mjs

      - name: Build static web app (STATIC_EXPORT)
        env:
          STATIC_EXPORT: "1"
        run: |
          # خروجی استاتیک مسیرهای سمت‌سرور ندارد (اپ اصلاً سرور لازم ندارد)
          mkdir -p /tmp/api-backup
          if [ -d src/app/api ]; then mv src/app/api /tmp/api-backup/api; fi
          npm run build
          if [ -d /tmp/api-backup/api ]; then mv /tmp/api-backup/api src/app/api; fi
          ls out | head -30
          du -sh out

      - name: Add Android platform + native patches
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nedaye-pahlavi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
